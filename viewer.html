<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storage Atlas · Galaxy</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030511;color:#ecf5ff;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:manipulation;outline:none}canvas:focus-visible{outline:2px solid #7eecff;outline-offset:-4px}#info{position:fixed;left:24px;bottom:22px;max-width:calc(100vw - 48px);font-size:12px;letter-spacing:.05em;color:#a9c6e5;text-shadow:0 1px 8px #000;pointer-events:none;line-height:1.6}#info strong{display:block;color:#f1f8ff;font-size:15px;overflow-wrap:anywhere}#info span{color:#7c96b4}#status{position:fixed;right:24px;bottom:24px;text-align:right;color:#9eb6d3;font-size:12px;pointer-events:none}#announce{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:600px){#info{left:14px;bottom:14px;max-width:75%}#status{right:14px;bottom:14px}}
</style></head><body><canvas id="space" tabindex="0" role="application" aria-label="Storage galaxy. Use arrow keys to select an item, Enter to enter a folder, Backspace to go back, and Page Up and Page Down to change pages."></canvas><div id="info" aria-hidden="true"></div><div id="status" aria-hidden="true"></div><div id="announce" aria-live="polite"></div><script>
const data = /* STORAGE_ATLAS_DATA */;
const canvas=document.querySelector('#space'), ctx=canvas.getContext('2d'), info=document.querySelector('#info'),status=document.querySelector('#status'),announce=document.querySelector('#announce');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let trail=[data.tree], page=0, selected=-1, hover=-1, boxes=[], transition=null, width=0,height=0,dpr=1,last=0;
const perPage=40, colors=[[102,220,246],[157,130,255],[97,236,192],[244,158,211],[250,197,126],[116,172,255]];
let seed=4032;function random(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}const stars=Array.from({length:200},()=>({x:random(),y:random(),r:.35+random()*1.4,phase:random()*6.28,speed:.3+random()}));
function bytes(n){if(!n)return '0 B';let i=Math.min(4,Math.floor(Math.log(n)/Math.log(1024)));return (n/1024**i).toFixed(i?2:0)+' '+['B','KiB','MiB','GiB','TiB'][i]}
function current(){return trail[trail.length-1]}function children(){return current().children||[]}function pages(){return Math.max(1,Math.ceil(children().length/perPage))}function shown(){return children().slice(page*perPage,(page+1)*perPage)}
function resize(){width=innerWidth;height=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=width*dpr;canvas.height=height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw(performance.now())}window.addEventListener('resize',resize);
function describe(){const item=shown()[hover>=0?hover:selected],path=data.root+(trail.length>1?' / '+trail.slice(1).map(n=>n.name).join(' / '):'');info.replaceChildren();let title=document.createElement('strong');title.textContent=item?item.name:current().name;let details=document.createElement('div');details.textContent=item?`${item.children?'FOLDER':'FILE'} · ${bytes(item.size)}${item.children?' · click to enter':''}`:`${bytes(current().size)} · ${children().length.toLocaleString()} objects`;let hint=document.createElement('span');hint.textContent='Click a cube to explore  ·  Backspace / right-click to return  ·  Scroll for more';info.append(title,details,hint);status.textContent=`${page+1} / ${pages()}  ·  ${data.errors.toLocaleString()} inaccessible`;canvas.setAttribute('aria-label',`Storage galaxy, ${path}. ${item?item.name+', '+bytes(item.size)+'. ':''}Arrow keys select; Enter enters a folder; Backspace goes back; Page Up and Page Down change pages.`)}
function bg(t){ctx.fillStyle='#030511';ctx.fillRect(0,0,width,height);let neb=ctx.createRadialGradient(width*.52,height*.43,0,width*.52,height*.43,Math.max(width,height)*.7);neb.addColorStop(0,'#18213d');neb.addColorStop(.38,'#0c1029');neb.addColorStop(1,'#030510');ctx.fillStyle=neb;ctx.fillRect(0,0,width,height);for(const s of stars){let twinkle=reduced?.65:.42+.4*(.5+.5*Math.sin(t*.001*s.speed+s.phase));ctx.globalAlpha=twinkle;ctx.fillStyle='#c9e3ff';ctx.beginPath();ctx.arc(s.x*width,s.y*height,s.r,0,7);ctx.fill()}ctx.globalAlpha=1}
function poly(points,fill,stroke){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
function rgba(c,a){return `rgba(${c[0]},${c[1]},${c[2]},${a})`}
function cube(item,index,x,y,edge,active){let c=colors[(page*perPage+index)%colors.length],sx=edge*.55,sy=edge*.27,h=edge*.66,stroke=rgba(c,active?.95:.55);ctx.save();if(active){ctx.shadowColor=rgba(c,.9);ctx.shadowBlur=25}poly([[x,y-h-sy],[x+sx,y-h],[x,y-h+sy],[x-sx,y-h]],rgba(c,.55),stroke);poly([[x-sx,y-h],[x,y-h+sy],[x,y+sy],[x-sx,y]],rgba(c,.20),stroke);poly([[x+sx,y-h],[x,y-h+sy],[x,y+sy],[x+sx,y]],rgba(c,.33),stroke);ctx.restore();if(edge>35){ctx.fillStyle=active?'#fff':'#c3d9ed';ctx.textAlign='center';ctx.font=`${active?'600':'400'} ${Math.min(13,Math.max(10,edge/8))}px system-ui`;let name=item.name.length>22?item.name.slice(0,20)+'…':item.name;ctx.fillText(name,x,y+sy+17,Math.max(65,edge*1.5));}return {x:x-sx-5,y:y-h-sy-5,w:sx*2+10,h:h+sy*2+10,item,index}}
function draw(t){last=t;bg(t);boxes=[];let items=shown(),cols=Math.max(1,Math.min(8,Math.ceil(Math.sqrt(items.length*width/Math.max(height,1)*.8)))),rows=Math.max(1,Math.ceil(items.length/cols));let availW=width*.88,availH=height*.66,cw=availW/cols,ch=availH/rows,maxEdge=Math.min(cw*.65,ch*.8,150),max=Math.max(1,children()[0]?.size||0);let scale=1,focusX=width/2,focusY=height/2;if(transition){let p=Math.min(1,(t-transition.start)/240),e=1-Math.pow(1-p,4);scale=1+e*3;focusX=transition.x;focusY=transition.y;if(p>=1){transition.commit();transition=null;draw(t);return}}ctx.save();ctx.translate(width/2,height/2);ctx.scale(scale,scale);ctx.translate(-focusX,-focusY);items.forEach((item,i)=>{let col=i%cols,row=Math.floor(i/cols),x=width*.06+cw*(col+.5),y=height*.17+ch*(row+.68);let edge=maxEdge*Math.cbrt(item.size/max);if(item.size===0)edge=3;boxes.push(cube(item,i,x,y,edge,i===(hover>=0?hover:selected)))});ctx.restore();if(!items.length){ctx.textAlign='center';ctx.fillStyle='#9fb8d2';ctx.font='14px system-ui';ctx.fillText('This galaxy is empty',width/2,height/2)}}
function tick(t){if(!transition){draw(t)}requestAnimationFrame(tick)}
function navigate(item,keyboard=false){if(!item||!item.children||transition)return;let b=boxes.find(x=>x.item===item);let commit=()=>{trail.push(item);page=0;selected=-1;hover=-1;describe();announce.textContent='Entered '+item.name};if(reduced||keyboard||!b){commit();draw(performance.now());return}transition={start:performance.now(),x:b.x+b.w/2,y:b.y+b.h/2,commit};}
function back(){if(transition||trail.length===1)return;trail.pop();page=0;selected=-1;hover=-1;describe();announce.textContent='Returned to '+current().name;draw(performance.now())}
function changePage(delta){let next=Math.max(0,Math.min(pages()-1,page+delta));if(next===page)return;page=next;selected=-1;hover=-1;describe();announce.textContent=`Page ${page+1} of ${pages()}`;draw(performance.now())}
function hit(e){let r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;return boxes.slice().reverse().find(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)}
canvas.addEventListener('pointermove',e=>{if(transition)return;let b=hit(e),next=b?b.index:-1;if(next!==hover){hover=next;canvas.style.cursor=b&&b.item.children?'pointer':'default';describe();if(reduced)draw(performance.now())}});canvas.addEventListener('pointerleave',()=>{hover=-1;describe()});canvas.addEventListener('click',e=>{let b=hit(e);if(b){selected=b.index;describe();navigate(b.item)}});canvas.addEventListener('contextmenu',e=>{e.preventDefault();back()});canvas.addEventListener('wheel',e=>{e.preventDefault();changePage(Math.sign(e.deltaY))},{passive:false});canvas.addEventListener('keydown',e=>{if(e.key==='Backspace'||e.key==='Escape'){e.preventDefault();back()}else if(e.key==='PageDown'||e.key==='PageUp'){e.preventDefault();changePage(e.key==='PageDown'?1:-1)}else if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();let n=shown().length;if(n){hover=-1;selected=(selected+(e.key==='ArrowRight'||e.key==='ArrowDown'?1:-1)+n)%n;describe();announce.textContent=shown()[selected].name+', '+bytes(shown()[selected].size);draw(performance.now())}}else if(e.key==='Enter'){e.preventDefault();navigate(shown()[selected],true)}});
resize();describe();if(!reduced)requestAnimationFrame(tick);
</script></body></html>
